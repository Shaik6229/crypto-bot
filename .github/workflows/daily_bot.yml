name: 1D Macro Liquidity Bot

on:
  schedule:
    # Runs at 00:07 UTC daily (05:37 AM IST)
    # Skips the midnight traffic jam and evaluates the finalized daily candle
    - cron: '7 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-daily-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run 1D Macro Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python daily_macro_bot.py
