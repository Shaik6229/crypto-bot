name: 1D Macro Liquidity Bot

on:
  schedule:
    - cron: '5 0 * * *' # Runs at 00:05 UTC daily
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  run-daily-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run 1D Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python daily_macro_bot.py

      - name: Persist 1D Bot State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only add the file IF it was created by the python script
          if [ -f daily_state.json ]; then
            git add daily_state.json
          fi
          
          # Commit and push if there are new changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily_state.json [skip ci]"
            git pull --rebase origin HEAD
            git push origin HEAD
          else
            echo "No macro alerts triggered. State file unchanged."
          fi
