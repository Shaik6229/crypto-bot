name: Crypto Liquidity Bot

on:
  schedule:
    # Runs at 7 minutes past every 4th hour (00:07, 04:07, 08:07, 12:07, 16:07, 20:07 UTC)
    # Bypasses top-of-the-hour queue congestion and confirms 4H candle close
    - cron: '7 */4 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write # Allows pushing bot_state.json back to your repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run 4H Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Persist Bot State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only stage the state file if it exists
          if [ -f bot_state.json ]; then
            git add bot_state.json
          fi
          
          # Commit and rebase-push only if changes occurred
          if ! git diff --cached --quiet; then
            git commit -m "chore: update bot_state.json [skip ci]"
            git pull --rebase origin HEAD
            git push origin HEAD
          else
            echo "No changes to 4H state file. Skipping commit."
          fi
