name: 1D Macro Liquidity Bot

on:
  schedule:
    # Runs at 00:07 UTC daily (05:37 AM IST)
    # Skips the midnight traffic jam and evaluates the finalized daily candle
    - cron: '7 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write # Allows pushing daily_state.json back to your repo

jobs:
  run-daily-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run 1D Macro Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python daily_macro_bot.py

      - name: Persist 1D Bot State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only stage the state file if it exists
          if [ -f daily_state.json ]; then
            git add daily_state.json
          fi
          
          # Commit and rebase-push only if changes occurred
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily_state.json [skip ci]"
            git pull --rebase origin HEAD
            git push origin HEAD
          else
            echo "No changes to 1D macro state file. Skipping commit."
          fi
