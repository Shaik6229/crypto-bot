name: Crypto Liquidity Bot

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours automatically
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Persist Bot State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only add the file IF it was created by the python script
          if [ -f bot_state.json ]; then
            git add bot_state.json
          fi
          
          # Commit and push if there are new changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update bot_state.json [skip ci]"
            git pull --rebase origin HEAD
            git push origin HEAD
          else
            echo "No new state to save. Skipping commit."
          fi
