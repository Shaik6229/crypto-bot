name: Crypto Liquidity Bot

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours automatically
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write # Grants the workflow permission to commit bot_state.json back to your repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # <--- THE FIX: Explicitly checks out the main branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Persist Bot State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          # Commit first, then pull/rebase to avoid 128 errors
          if ! git diff --cached --quiet; then
            git commit -m "chore: update bot_state.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to bot state."
          fi
          
