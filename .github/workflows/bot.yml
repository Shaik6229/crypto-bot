name: Crypto Liquidity Bot

on:
  schedule:
    # Runs at 5 minutes past every 4th hour (00:05, 04:05, 08:05 UTC, etc.)
    # This avoids the GitHub server traffic jam and ensures the 4H candle is fully closed.
    - cron: '5 */4 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
