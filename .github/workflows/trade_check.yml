name: Trade Check

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Coin symbol, e.g. SUI"
        required: true
        type: string

      entry_price:
        description: "Your entry price"
        required: true
        type: string

jobs:
  trade-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run trade analysis
        env:
          SYMBOL: ${{ inputs.symbol }}
          ENTRY_PRICE: ${{ inputs.entry_price }}
        run: |
          python -c "
          import os
          from trade_assistant import analyze_trade, format_trade_report

          symbol = os.environ['SYMBOL']
          entry = float(os.environ['ENTRY_PRICE'])

          result = analyze_trade(symbol, entry)

          print(format_trade_report(result))
          "
